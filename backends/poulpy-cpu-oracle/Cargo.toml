[package]
name = "poulpy-cpu-oracle"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
readme = "README.md"
description = "Independent scalar CPU oracle for Poulpy correctness tests"
repository.workspace = true
homepage.workspace = true

[features]
enable-core = ["dep:poulpy-core"]
enable-ckks = ["enable-core", "dep:poulpy-ckks", "dep:anyhow"]
enable-bin-fhe = ["enable-core", "dep:poulpy-bin-fhe"]
enable-blas = ["enable-ckks", "dep:poulpy-blas"]

[dependencies]
anyhow = {workspace = true, optional = true}
dashu-int = {workspace = true}
poulpy-core = {workspace = true, optional = true}
poulpy-ckks = {workspace = true, optional = true}
poulpy-bin-fhe = {workspace = true, optional = true}
poulpy-blas = {workspace = true, optional = true}
poulpy-hal = {workspace = true}
bytemuck = {workspace = true}
rand = {workspace = true}
rand_distr = {workspace = true}

[lib]
doctest = false

[dev-dependencies]
once_cell = {workspace = true}
poulpy-ckks = {workspace = true, features = ["test-utils"]}
poulpy-blas = {workspace = true, features = ["test-utils"]}
