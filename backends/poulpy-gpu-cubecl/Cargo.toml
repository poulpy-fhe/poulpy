[package]
name = "poulpy-gpu-cubecl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A crate providing GPU implementations of poulpy-hal through its open extension points, on CubeCL"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/poulpy-gpu-cubecl"

[lib]
doctest = false

[features]
# One feature per CubeCL runtime; each exposes its backend type.
enable-cuda = ["cubecl/cuda"]
enable-hip = ["cubecl/hip"]
# The wgpu runtime, with the shader compiler of each target.
enable-metal = ["cubecl/metal"]
enable-vulkan = ["cubecl/vulkan"]
enable-wgpu = ["cubecl/webgpu"]
enable-core = ["dep:poulpy-core", "poulpy-cpu-portable/enable-core"]
enable-ckks = ["enable-core", "dep:poulpy-ckks", "dep:anyhow", "poulpy-cpu-portable/enable-ckks"]

[dependencies]
poulpy-hal = {workspace = true}
poulpy-cpu-portable = {workspace = true}
poulpy-core = {workspace = true, optional = true}
poulpy-ckks = {workspace = true, optional = true}
anyhow = {workspace = true, optional = true}
bytemuck = {workspace = true}
cubecl = {version = "=0.11.1"}
# `StreamId`, to pin the client: `cubecl` does not re-export it.
cubecl-environment = {version = "=0.11.1"}
pollster = "0.4"

[dev-dependencies]
# Shared test helpers and the portable comparison backends.
poulpy-cpu-portable = {workspace = true, features = ["enable-core", "enable-test-suite"]}
poulpy-core = {workspace = true}
poulpy-ckks = {workspace = true, features = ["test-utils"]}
poulpy-bench = {workspace = true}
criterion = {workspace = true}
once_cell = {workspace = true}

[[bench]]
name = "standard"
harness = false
required-features = ["enable-ckks"]

[[bench]]
name = "bootstrapping"
harness = false
required-features = ["enable-ckks"]
