[package]
name = "poulpy-gpu-portable"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
description = "A crate providing GPU implementations of poulpy-hal through its open extension points, on CubeCL"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/poulpy-gpu-portable"

[lib]
doctest = false

[features]
# One feature per CubeCL runtime; each exposes its backend type.
enable-cuda = ["cubecl/cuda"]
enable-hip = ["cubecl/hip"]
# The wgpu runtime, with the shader compiler of each target.
enable-metal = ["cubecl/metal"]
enable-vulkan = ["cubecl/vulkan"]
enable-wgpu = ["cubecl/webgpu"]
enable-core = ["dep:poulpy-core", "poulpy-cpu-portable/enable-core"]
enable-ckks = ["enable-core", "dep:poulpy-ckks", "dep:anyhow", "poulpy-cpu-portable/enable-ckks"]
enable-blas = ["enable-ckks", "dep:poulpy-blas"]

[dependencies]
poulpy-hal = {workspace = true}
poulpy-cpu-portable = {workspace = true}
poulpy-core = {workspace = true, optional = true}
poulpy-ckks = {workspace = true, optional = true}
poulpy-blas = {workspace = true, optional = true}
anyhow = {workspace = true, optional = true}
bytemuck = {workspace = true}
cubecl = {workspace = true}
# `StreamId`, to pin the client: `cubecl` does not re-export it.
cubecl-environment = {workspace = true}
pollster = {workspace = true}

[dev-dependencies]
# Shared test helpers and the portable comparison backends.
poulpy-cpu-portable = {workspace = true, features = ["enable-core", "enable-blas", "enable-test-suite"]}
poulpy-core = {workspace = true}
poulpy-ckks = {workspace = true, features = ["test-utils"]}
poulpy-blas = {workspace = true, features = ["test-utils"]}
poulpy-bench = {workspace = true}
criterion = {workspace = true}
# `pod_collect_to_vec`, which the wgpu runtime's dependencies happen to enable.
bytemuck = {workspace = true, features = ["extern_crate_alloc"]}
once_cell = {workspace = true}
# The reference ChaCha8 keystream of the device sampler's test.
rand_chacha = {workspace = true}
rand_core = {workspace = true}

[package.metadata.docs.rs]
# The Vulkan runtime builds without a vendor toolkit, unlike CUDA and HIP.
features = ["enable-vulkan", "enable-ckks", "enable-blas"]
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "standard"
harness = false
required-features = ["enable-ckks"]

[[bench]]
name = "bootstrapping"
harness = false
required-features = ["enable-ckks"]
