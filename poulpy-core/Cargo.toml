[package]
name = "poulpy-core"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
description = "A backend-agnostic crate implementing Module-LWE-based encryption and arithmetic"
repository = "https://github.com/poulpy-fhe/poulpy"
homepage = "https://github.com/poulpy-fhe/poulpy"
documentation = "https://docs.rs/poulpy-core"

[features]
default = []
enable-core = []
enable-avx = []
enable-avx512f = []
enable-ifma = ["enable-avx512f"]

[dependencies]
dashu-float = {workspace = true}
poulpy-hal = {workspace = true}
itertools = {workspace = true}
byteorder = {workspace = true}
bytemuck = {workspace = true}
once_cell = {workspace = true}
paste = {workspace = true}
rand = {workspace = true}
num-traits = {workspace = true}
rand_distr = {workspace = true}
anyhow = {workspace = true}
