[package]
name = "poulpy-blas"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
description = "Backend-agnostic encrypted matrix arithmetic (JKLS) on poulpy-ckks"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/poulpy-blas"

[features]
