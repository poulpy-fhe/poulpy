name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2026-05-14

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Check the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cargo metadata --format-version 1 --no-deps > "$RUNNER_TEMP/meta.json"
          TAG="${GITHUB_REF#refs/tags/v}" python3 - <<'EOF'
          import json, os, sys
          tag = os.environ["TAG"]
          pkgs = json.load(open(os.environ["RUNNER_TEMP"] + "/meta.json"))["packages"]
          bad = sorted("%s %s" % (p["name"], p["version"]) for p in pkgs if p["version"] != tag)
          if bad:
              sys.exit("tag v%s does not match: %s" % (tag, ", ".join(bad)))
          print("all %d crates at %s" % (len(pkgs), tag))
          EOF

      - name: Dry run
        run: cargo publish --workspace --dry-run

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crates not yet on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo metadata --format-version 1 --no-deps > "$RUNNER_TEMP/meta.json"
          PKGS=$(python3 - <<'EOF'
          import json, os, sys, urllib.request
          for p in json.load(open(os.environ["RUNNER_TEMP"] + "/meta.json"))["packages"]:
              if p["publish"] == []:
                  continue
              url = "https://crates.io/api/v1/crates/%s/%s" % (p["name"], p["version"])
              try:
                  urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "poulpy-release"}))
                  print("already published: %s %s" % (p["name"], p["version"]), file=sys.stderr)
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
                  print("-p", p["name"])
          EOF
          )
          if [ -n "$PKGS" ]; then
              cargo publish $PKGS
          else
              echo "nothing to publish"
          fi
