name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2026-03-21
  PORTABLE_FEATURES: >-
    poulpy-core/enable-core
    poulpy-ckks/enable-ckks
    poulpy-cpu-ref/enable-core
    poulpy-cpu-ref/enable-ckks
    poulpy-cpu-avx/enable-ckks
    poulpy-bin-fhe/enable-bin-fhe
    poulpy-bench/hal-bench
    poulpy-bench/core-bench
    poulpy-bench/bin-fhe-bench
    poulpy-bench/ckks-bench
  AVX_FEATURES: >-
    poulpy-core/enable-core
    poulpy-core/enable-avx
    poulpy-ckks/enable-ckks
    poulpy-ckks/enable-avx
    poulpy-cpu-ref/enable-core
    poulpy-cpu-ref/enable-ckks
    poulpy-cpu-avx/enable-ckks
    poulpy-cpu-avx/enable-avx
    poulpy-bin-fhe/enable-bin-fhe
    poulpy-bin-fhe/enable-avx
    poulpy-bench/hal-bench
    poulpy-bench/core-bench
    poulpy-bench/bin-fhe-bench
    poulpy-bench/ckks-bench
    poulpy-bench/enable-avx
  NEON_FEATURES: >-
    poulpy-core/enable-core
    poulpy-core/enable-neon
    poulpy-ckks/enable-ckks
    poulpy-ckks/enable-neon
    poulpy-cpu-ref/enable-core
    poulpy-cpu-ref/enable-ckks
    poulpy-cpu-arm/enable-ckks
    poulpy-cpu-arm/enable-neon
    poulpy-bin-fhe/enable-bin-fhe
    poulpy-bin-fhe/enable-neon
    poulpy-bench/hal-bench
    poulpy-bench/core-bench
    poulpy-bench/bin-fhe-bench
    poulpy-bench/ckks-bench
    poulpy-bench/enable-neon

jobs:
  portable:
    name: Portable features
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-portable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-portable-
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Check all non-AVX features
        run: cargo check --workspace --all-targets --features "$PORTABLE_FEATURES"

      - name: Clippy all non-AVX features
        run: cargo clippy --workspace --all-targets --features "$PORTABLE_FEATURES" -- -D warnings

      - name: Test all non-AVX features
        run: cargo test --workspace --features "$PORTABLE_FEATURES"

  avx:
    name: AVX backend
    runs-on: ubuntu-latest

    env:
      RUSTFLAGS: -C target-feature=+avx2,+fma
      RUSTDOCFLAGS: -C target-feature=+avx2 -C target-feature=+fma

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-avx-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-avx-
            ${{ runner.os }}-cargo-

      - name: Detect AVX2 and FMA
        id: avx
        run: |
          if lscpu | grep -qi avx2 && lscpu | grep -qi fma; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check AVX backend
        if: steps.avx.outputs.supported == 'true'
        run: cargo check --workspace --all-targets --features "$AVX_FEATURES"

      - name: Clippy AVX backend
        if: steps.avx.outputs.supported == 'true'
        run: cargo clippy --workspace --all-targets --features "$AVX_FEATURES" -- -D warnings

      - name: Test AVX backend
        if: steps.avx.outputs.supported == 'true'
        run: cargo test --workspace --features "$AVX_FEATURES"

      - name: Skip AVX backend
        if: steps.avx.outputs.supported != 'true'
        run: echo "Runner CPU does not expose AVX2 and FMA; AVX backend checks skipped."

  neon:
    name: NEON backend (aarch64 via qemu)
    runs-on: ubuntu-latest

    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64-static

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
          targets: aarch64-unknown-linux-gnu

      - name: Install qemu-user-static and aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static gcc-aarch64-linux-gnu

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-neon-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-neon-
            ${{ runner.os }}-cargo-

      - name: Check NEON backend (workspace libs)
        run: cargo check --workspace --target aarch64-unknown-linux-gnu --features "$NEON_FEATURES"

      - name: Clippy NEON backend (workspace libs)
        run: cargo clippy --workspace --target aarch64-unknown-linux-gnu --features "$NEON_FEATURES" -- -D warnings

      - name: Test NEON backend under qemu
        run: cargo test -p poulpy-cpu-arm --target aarch64-unknown-linux-gnu --features "enable-neon,enable-ckks"

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    needs:
      - portable
      - avx
      - neon
    if: always()

    steps:
      - name: Check CI jobs
        run: |
          if [ "${{ needs.portable.result }}" != "success" ]; then
            echo "Portable features job finished with: ${{ needs.portable.result }}"
            exit 1
          fi

          if [ "${{ needs.avx.result }}" != "success" ]; then
            echo "AVX backend job finished with: ${{ needs.avx.result }}"
            exit 1
          fi

          if [ "${{ needs.neon.result }}" != "success" ]; then
            echo "NEON backend job finished with: ${{ needs.neon.result }}"
            exit 1
          fi

          echo "Portable, AVX and NEON CI jobs passed."
