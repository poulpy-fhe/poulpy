name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_neon_qemu:
        description: Run additional NEON HAL, core and CKKS tests under QEMU on x86
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2026-05-14
  # Update the archive and its published SHA256 together from Intel's download page:
  # https://www.intel.com/content/www/us/en/download/684897/intel-software-development-emulator.html
  SDE_ARCHIVE: sde-external-10.13.1-2026-07-28-lin.tar.xz
  SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
  SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
  PORTABLE_FEATURES: >-
    poulpy-core/enable-core
    poulpy-cpu-ref/enable-core
    poulpy-cpu-ref/enable-ckks
    poulpy-cpu-ref/enable-bin-fhe
    poulpy-bin-fhe/enable-bin-fhe
  AVX_FEATURES: >-
    poulpy-core/enable-core
    poulpy-cpu-ref/enable-core
    poulpy-cpu-ref/enable-ckks
    poulpy-cpu-ref/enable-bin-fhe
    poulpy-cpu-avx/enable-avx
    poulpy-cpu-avx/enable-ckks
    poulpy-cpu-avx/enable-bin-fhe
    poulpy-cpu-avx/enable-rayon
    poulpy-bin-fhe/enable-bin-fhe
  AVX512_FEATURES: >-
    poulpy-core/enable-core
    poulpy-cpu-ref/enable-core
    poulpy-cpu-ref/enable-ckks
    poulpy-cpu-ref/enable-bin-fhe
    poulpy-cpu-avx/enable-avx
    poulpy-cpu-avx/enable-ckks
    poulpy-cpu-avx/enable-bin-fhe
    poulpy-cpu-avx/enable-rayon
    poulpy-cpu-avx512/enable-ckks
    poulpy-cpu-avx512/enable-bin-fhe
    poulpy-cpu-avx512/enable-ifma
    poulpy-cpu-avx512/enable-rayon
    poulpy-bin-fhe/enable-bin-fhe
  NEON_FEATURES: >-
    poulpy-core/enable-core
    poulpy-cpu-ref/enable-core
    poulpy-cpu-ref/enable-ckks
    poulpy-cpu-ref/enable-bin-fhe
    poulpy-cpu-arm/enable-ckks
    poulpy-cpu-arm/enable-bin-fhe
    poulpy-cpu-arm/enable-neon
    poulpy-cpu-arm/enable-rayon
    poulpy-bin-fhe/enable-bin-fhe

jobs:
  portable:
    name: Portable features
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-portable-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-portable-
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Check all non-AVX features
        run: cargo check --workspace --all-targets --features "$PORTABLE_FEATURES"

      - name: Clippy all non-AVX features
        run: cargo clippy --workspace --all-targets --features "$PORTABLE_FEATURES" -- -D warnings

      - name: Test all non-AVX features
        shell: bash
        run: cargo test --workspace --profile ci --features "$PORTABLE_FEATURES"

      - name: Check scheme documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc -p poulpy-core -p poulpy-ckks -p poulpy-bin-fhe --no-deps --features poulpy-core/enable-core,poulpy-ckks/test-utils

  avx:
    name: AVX backend (native or SDE)
    runs-on: ubuntu-24.04
    # Cold compilation is separate from the five-minute test execution budget.
    timeout-minutes: 20

    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-feature=+avx2,+fma
      RUSTDOCFLAGS: -C target-feature=+avx2,+fma
      CARGO_PROFILE_CI_DEBUG: 0
      RAYON_NUM_THREADS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu
          components: clippy

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-avx-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-avx-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-avx-${{ env.RUST_TOOLCHAIN }}-

      - name: Clippy AVX backend
        run: cargo clippy --workspace --all-targets --features "$AVX_FEATURES" -- -D warnings

      - name: Detect native AVX2 and FMA support
        id: avx
        shell: bash
        run: |
          rustc --edition=2024 -o "$RUNNER_TEMP/check-avx" - <<'RS'
          fn main() {
              let native = std::is_x86_feature_detected!("avx2")
                  && std::is_x86_feature_detected!("fma");
              println!("mode={}", if native { "native" } else { "emulated" });
          }
          RS
          "$RUNNER_TEMP/check-avx" | tee -a "$GITHUB_OUTPUT"

      - name: Install Intel SDE
        if: steps.avx.outputs.mode == 'emulated'
        run: |
          curl --fail --location --retry 3 "$SDE_URL" --output "$RUNNER_TEMP/$SDE_ARCHIVE"
          printf '%s  %s\n' "$SDE_SHA256" "$RUNNER_TEMP/$SDE_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/intel-sde"
          tar --extract --xz --file "$RUNNER_TEMP/$SDE_ARCHIVE" --directory "$RUNNER_TEMP/intel-sde" --strip-components=1
          sudo sysctl -w kernel.yama.ptrace_scope=0
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$RUNNER_TEMP/intel-sde/sde64 -hsw --" >> "$GITHUB_ENV"

      - name: Compile AVX test binary
        run: bash .github/scripts/test-backend.sh build avx '${{ steps.avx.outputs.mode }}'

      - name: Test AVX backend
        timeout-minutes: 8
        run: bash .github/scripts/test-backend.sh test avx '${{ steps.avx.outputs.mode }}'

  intel_macos_avx:
    name: Intel macOS AVX smoke
    runs-on: macos-15-intel
    timeout-minutes: 10

    env:
      RUSTFLAGS: -C target-feature=+avx2,+fma

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-15-intel-cargo-avx-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-15-intel-cargo-avx-

      - name: Test portable binary128 math on Darwin
        run: |
          CARGO_TERM_COLOR=never cargo test -p poulpy-ckks --lib --features libquadmath -- --list | grep -Ec '^scalar::tests::portable_(binary128_roundtrip|log_regressions_terminate|math_surface_values|special_value_semantics): test$' | grep -qx '4'
          cargo test -p poulpy-ckks --lib --features libquadmath scalar::tests::portable_binary128_roundtrip -- --exact
          cargo test -p poulpy-ckks --lib --features libquadmath scalar::tests::portable_log_regressions_terminate -- --exact
          cargo test -p poulpy-ckks --lib --features libquadmath scalar::tests::portable_math_surface_values -- --exact
          cargo test -p poulpy-ckks --lib --features libquadmath scalar::tests::portable_special_value_semantics -- --exact

      - name: Test Quad CKKS encoding on Darwin
        run: >-
          cargo test -p poulpy-cpu-ref --lib
          --features "enable-ckks,poulpy-ckks/libquadmath"
          ckks_encoding::tests::fft64_precision_families_coexist_in_one_module
          -- --exact

      - name: Test Darwin AVX FFT assembly
        run: >-
          cargo test -p poulpy-cpu-avx --lib
          --features "enable-avx,poulpy-ckks/libquadmath"
          fft64::reim::fft_avx2_fma::tests::fft_ifft_roundtrip_avx2
          -- --exact

  macos_arm_quad:
    name: Apple Silicon Quad smoke
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm-cargo-quad-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-arm-cargo-quad-

      - name: Test portable binary128 and Quad encoding
        run: |
          CARGO_TERM_COLOR=never cargo test -p poulpy-ckks --lib --features libquadmath -- --list | grep -Ec '^scalar::tests::portable_(binary128_roundtrip|log_regressions_terminate|math_surface_values|special_value_semantics): test$' | grep -qx '4'
          cargo test -p poulpy-ckks --lib --features libquadmath scalar::tests::portable_binary128_roundtrip -- --exact
          cargo test -p poulpy-ckks --lib --features libquadmath scalar::tests::portable_log_regressions_terminate -- --exact
          cargo test -p poulpy-ckks --lib --features libquadmath scalar::tests::portable_math_surface_values -- --exact
          cargo test -p poulpy-ckks --lib --features libquadmath scalar::tests::portable_special_value_semantics -- --exact
          cargo test -p poulpy-cpu-ref --lib --features "enable-ckks,poulpy-ckks/libquadmath" ckks_encoding::tests::fft64_precision_families_coexist_in_one_module -- --exact

  # Run natively when every required CPU feature is usable; otherwise use SDE.
  avx512:
    name: AVX-512 backend (native or SDE)
    runs-on: ubuntu-24.04
    # Cold compilation is separate from the five-minute test execution budget.
    timeout-minutes: 20

    # Hosted runners need not expose AVX-512, so we keep AVX-512 flags
    # off the host toolchain (build scripts, proc-macros). We pin --target and
    # use the target-scoped CARGO_TARGET_<TRIPLE>_RUSTFLAGS variable so host
    # artifacts stay portable while the workspace itself builds for AVX-512.
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-feature=+avx2,+fma,+avx512f,+avx512ifma,+avx512vl,+bmi2,+adx
      RUSTDOCFLAGS: -C target-feature=+avx2,+fma,+avx512f,+avx512ifma,+avx512vl,+bmi2,+adx
      CARGO_PROFILE_CI_DEBUG: 0
      # Exercise the Rayon overrides with a bounded pool under emulation.
      RAYON_NUM_THREADS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu
          components: clippy

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-avx512-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-avx512-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-avx512-${{ env.RUST_TOOLCHAIN }}-

      - name: Clippy AVX-512 backend
        run: cargo clippy --workspace --all-targets --features "$AVX512_FEATURES" -- -D warnings

      - name: Detect native AVX-512 support
        id: avx512
        run: |
          # Compile for the baseline host, without the target-scoped Cargo flags.
          # Runtime detection also checks the OS enables AVX/AVX-512 register state.
          rustc --edition=2024 -o "$RUNNER_TEMP/check-avx512" - <<'RS'
          fn main() {
              // Include the features LLVM enables implicitly with our target flags.
              let native = std::is_x86_feature_detected!("avx2")
                  && std::is_x86_feature_detected!("fma")
                  && std::is_x86_feature_detected!("avx512f")
                  && std::is_x86_feature_detected!("avx512ifma")
                  && std::is_x86_feature_detected!("avx512vl")
                  && std::is_x86_feature_detected!("bmi2")
                  && std::is_x86_feature_detected!("adx")
                  && std::is_x86_feature_detected!("avx")
                  && std::is_x86_feature_detected!("f16c")
                  && std::is_x86_feature_detected!("sse3")
                  && std::is_x86_feature_detected!("ssse3")
                  && std::is_x86_feature_detected!("sse4.1")
                  && std::is_x86_feature_detected!("sse4.2");
              println!("mode={}", if native { "native" } else { "emulated" });
          }
          RS
          "$RUNNER_TEMP/check-avx512" | tee -a "$GITHUB_OUTPUT"

      - name: Install Intel SDE
        if: steps.avx512.outputs.mode == 'emulated'
        run: |
          curl --fail --location --retry 3 "$SDE_URL" --output "$RUNNER_TEMP/$SDE_ARCHIVE"
          printf '%s  %s\n' "$SDE_SHA256" "$RUNNER_TEMP/$SDE_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/intel-sde"
          tar --extract --xz --file "$RUNNER_TEMP/$SDE_ARCHIVE" --directory "$RUNNER_TEMP/intel-sde" --strip-components=1
          # Pin/SDE may need to attach to its parent on Ubuntu; this hosted VM is ephemeral.
          sudo sysctl -w kernel.yama.ptrace_scope=0
          # Only target executables run under SDE; Cargo and build scripts remain native.
          # Ice Lake includes AVX-512F, AVX-512VL and IFMA.
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$RUNNER_TEMP/intel-sde/sde64 -icl --" >> "$GITHUB_ENV"

      - name: Compile AVX-512 test binary
        run: bash .github/scripts/test-backend.sh build avx512 '${{ steps.avx512.outputs.mode }}'

      - name: Test AVX-512 backend
        timeout-minutes: 8
        run: bash .github/scripts/test-backend.sh test avx512 '${{ steps.avx512.outputs.mode }}'

  neon:
    name: NEON backend (aarch64 native)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: arm64-cargo-neon-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            arm64-cargo-neon-

      - name: Check NEON backend
        run: cargo check --workspace --all-targets --features "$NEON_FEATURES"

      - name: Clippy NEON backend
        run: cargo clippy --workspace --all-targets --features "$NEON_FEATURES" -- -D warnings

      - name: Test NEON backend
        shell: bash
        run: cargo test -p poulpy-cpu-arm --profile ci --features "$NEON_FEATURES"

  # Optional emulator validation; the required native neon job runs the full suite.
  neon_hal:
    name: NEON HAL, core and CKKS (manual QEMU)
    if: github.event_name == 'workflow_dispatch' && inputs.run_neon_qemu
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CARGO_BUILD_TARGET: aarch64-unknown-linux-gnu
      RAYON_NUM_THREADS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install AArch64 toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          # Cortex-A72 supplies baseline NEON; -L locates the target libc.
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64 -cpu cortex-a72 -L /usr/aarch64-linux-gnu" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-neon-hal-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-neon-hal-

      - name: Test NEON HAL, core and CKKS operations
        shell: bash
        # Exercise optional HAL, core and CKKS contract coverage and include constant-convolution kernel tests.
        run: >-
          cargo test -p poulpy-cpu-arm --lib --profile ci
          --features "enable-neon,enable-rayon,enable-ckks" --
          test_vec_znx test_svp test_vmp test_convolution test_cnv test_word_compat test_transfer
          raw_transform_matches_contract convolution_by_const core_parity core_encryption glwe_copy ckks_parity
          --test-threads=2

  miri:
    name: Miri (poulpy-hal unit tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: miri

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-miri-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-miri-
            ${{ runner.os }}-cargo-

      - name: Miri setup
        run: cargo miri setup

      - name: Miri poulpy-hal unit tests
        run: cargo miri test -p poulpy-hal --lib

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    needs:
      - portable
      - avx
      - intel_macos_avx
      - macos_arm_quad
      - avx512
      - neon
      - neon_hal
      - miri
    if: always()

    steps:
      - name: Check CI jobs
        run: |
          if [ "${{ needs.portable.result }}" != "success" ]; then
            echo "Portable features job finished with: ${{ needs.portable.result }}"
            exit 1
          fi

          if [ "${{ needs.avx.result }}" != "success" ]; then
            echo "AVX backend job finished with: ${{ needs.avx.result }}"
            exit 1
          fi

          if [ "${{ needs.intel_macos_avx.result }}" != "success" ]; then
            echo "Intel macOS AVX job finished with: ${{ needs.intel_macos_avx.result }}"
            exit 1
          fi

          if [ "${{ needs.macos_arm_quad.result }}" != "success" ]; then
            echo "Apple Silicon Quad job finished with: ${{ needs.macos_arm_quad.result }}"
            exit 1
          fi

          if [ "${{ needs.avx512.result }}" != "success" ]; then
            echo "AVX-512 backend job finished with: ${{ needs.avx512.result }}"
            exit 1
          fi

          if [ "${{ needs.neon.result }}" != "success" ]; then
            echo "NEON backend job finished with: ${{ needs.neon.result }}"
            exit 1
          fi

          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.run_neon_qemu }}" = "true" ]; then
            if [ "${{ needs.neon_hal.result }}" != "success" ]; then
              echo "Requested NEON QEMU job finished with: ${{ needs.neon_hal.result }}"
              exit 1
            fi
          elif [ "${{ needs.neon_hal.result }}" != "skipped" ]; then
            echo "NEON QEMU job was not requested but finished with: ${{ needs.neon_hal.result }}"
            exit 1
          fi

          if [ "${{ needs.miri.result }}" != "success" ]; then
            echo "Miri job finished with: ${{ needs.miri.result }}"
            exit 1
          fi

          echo "All required CI jobs passed, including NEON QEMU when requested."
