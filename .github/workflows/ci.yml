name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_neon_qemu:
        description: Run additional NEON HAL, core and CKKS tests under QEMU on x86
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2026-05-14
  # Update the archive and its published SHA256 together from Intel's download page:
  # https://www.intel.com/content/www/us/en/download/684897/intel-software-development-emulator.html
  SDE_ARCHIVE: sde-external-10.13.1-2026-07-28-lin.tar.xz
  SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
  SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
  PORTABLE_FEATURES: >-
    poulpy-core/enable-core
    poulpy-cpu-oracle/enable-ckks
    poulpy-cpu-oracle/enable-bin-fhe
    poulpy-cpu-oracle/enable-blas
    poulpy-cpu-portable/enable-core
    poulpy-cpu-portable/enable-ckks
    poulpy-cpu-portable/enable-bin-fhe
    poulpy-cpu-portable/enable-mhe
    poulpy-cpu-portable/enable-blas
    poulpy-cpu-rayon/enable-ckks
    poulpy-cpu-rayon/enable-bin-fhe
    poulpy-cpu-rayon/enable-mhe
    poulpy-cpu-rayon/enable-blas
    poulpy-bin-fhe/enable-bin-fhe
  AVX_FEATURES: >-
    poulpy-core/enable-core
    poulpy-cpu-portable/enable-core
    poulpy-cpu-portable/enable-ckks
    poulpy-cpu-portable/enable-bin-fhe
    poulpy-cpu-portable/enable-mhe
    poulpy-cpu-avx/enable-avx
    poulpy-cpu-avx/enable-ckks
    poulpy-cpu-avx/enable-bin-fhe
    poulpy-cpu-avx/enable-rayon
    poulpy-cpu-avx/enable-blas
    poulpy-bin-fhe/enable-bin-fhe
  AVX512_FEATURES: >-
    poulpy-core/enable-core
    poulpy-cpu-portable/enable-core
    poulpy-cpu-portable/enable-ckks
    poulpy-cpu-portable/enable-bin-fhe
    poulpy-cpu-portable/enable-mhe
    poulpy-cpu-avx/enable-avx
    poulpy-cpu-avx/enable-ckks
    poulpy-cpu-avx/enable-bin-fhe
    poulpy-cpu-avx/enable-rayon
    poulpy-cpu-avx512/enable-ckks
    poulpy-cpu-avx512/enable-bin-fhe
    poulpy-cpu-avx512/enable-ifma
    poulpy-cpu-avx512/enable-rayon
    poulpy-cpu-avx512/enable-blas
    poulpy-bin-fhe/enable-bin-fhe
  NEON_FEATURES: >-
    poulpy-core/enable-core
    poulpy-cpu-portable/enable-core
    poulpy-cpu-portable/enable-ckks
    poulpy-cpu-portable/enable-bin-fhe
    poulpy-cpu-portable/enable-mhe
    poulpy-cpu-arm/enable-ckks
    poulpy-cpu-arm/enable-bin-fhe
    poulpy-cpu-arm/enable-neon
    poulpy-cpu-arm/enable-rayon
    poulpy-cpu-arm/enable-blas
    poulpy-bin-fhe/enable-bin-fhe

jobs:
  # Pull requests run only the jobs whose crates the change touches or depends on; other events run all.
  changes:
    name: Affected crates
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.affected.outputs.crates }}

    steps:
      # The pull request merge commit and its base parent.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: List affected crates
        id: affected
        env:
          # Reading manifests needs no pinned toolchain.
          RUSTUP_TOOLCHAIN: stable
        run: |
          crates=$(bash .github/scripts/affected-crates.sh ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }})
          echo "crates=$crates" | tee -a "$GITHUB_OUTPUT"

  portable_lint:
    name: Portable lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-portable-lint-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-portable-lint-
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Check all non-AVX features
        run: cargo check --workspace --all-targets --features "$PORTABLE_FEATURES"

      - name: Clippy all non-AVX features
        run: cargo clippy --workspace --all-targets --features "$PORTABLE_FEATURES" -- -D warnings

      - name: Check scheme documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc -p poulpy-core -p poulpy-ckks -p poulpy-bin-fhe -p poulpy-mhe -p poulpy-blas -p poulpy-libm --no-deps --features poulpy-core/enable-core,poulpy-ckks/test-utils,poulpy-blas/test-utils,poulpy-libm/test-utils

  portable_libs:
    name: Portable libraries and doctests
    runs-on: ubuntu-latest

    env:
      CARGO_PROFILE_CI_DEBUG: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-portable-libs-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-portable-libs-
            ${{ runner.os }}-cargo-

      # The excluded backends run in the sharded portable_test job.
      - name: Test libraries
        run: >-
          cargo test --workspace --profile ci
          --exclude poulpy-cpu-portable --exclude poulpy-cpu-oracle --exclude poulpy-cpu-rayon
          --features "poulpy-core/enable-core poulpy-bin-fhe/enable-bin-fhe"

      - name: Test all non-AVX doctests
        run: cargo test --workspace --doc --profile ci --features "$PORTABLE_FEATURES"

  portable_quad:
    name: Portable libquadmath determinism
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.crates), 'poulpy-cpu-portable')
    runs-on: ubuntu-latest

    env:
      CARGO_PROFILE_CI_DEBUG: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-portable-quad-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-portable-quad-
            ${{ runner.os }}-cargo-

      # CKKS setup math uses the pure-Rust binary128 backing whatever the `Quad` routing.
      - name: Test CKKS encoding determinism with libquadmath
        run: cargo test -p poulpy-cpu-portable --lib --profile ci --features "enable-ckks,poulpy-ckks/libquadmath" determinism

  # Each backend test binary compiles once; portable_test runs it in round-robin shards.
  portable_build:
    name: Portable build (${{ matrix.backend }})
    needs: changes
    if: >-
      contains(fromJSON(needs.changes.outputs.crates), 'poulpy-cpu-portable') ||
      contains(fromJSON(needs.changes.outputs.crates), 'poulpy-cpu-oracle') ||
      contains(fromJSON(needs.changes.outputs.crates), 'poulpy-cpu-rayon')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Per-backend split of PORTABLE_FEATURES.
        include:
          - backend: portable
            features: enable-core enable-ckks enable-bin-fhe enable-mhe enable-blas
          - backend: oracle
            features: enable-ckks enable-bin-fhe enable-blas
          - backend: rayon
            features: enable-ckks enable-bin-fhe enable-mhe enable-blas

    env:
      CARGO_PROFILE_CI_DEBUG: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-portable-${{ matrix.backend }}-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-portable-${{ matrix.backend }}-
            ${{ runner.os }}-cargo-

      - name: Compile test binaries
        shell: bash
        run: |
          cargo test -p poulpy-cpu-${{ matrix.backend }} --profile ci --features "${{ matrix.features }}" \
            --no-run --message-format=json-render-diagnostics |
            bash .github/scripts/test-shard.sh pack "$RUNNER_TEMP/tests"
          # A tarball keeps the executable bits that artifact zips drop.
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/tests.tar" tests

      - name: Upload test binaries
        uses: actions/upload-artifact@v4
        with:
          name: portable-tests-${{ matrix.backend }}
          path: ${{ runner.temp }}/tests.tar
          retention-days: 1

  portable_test:
    name: Portable tests (${{ matrix.backend }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: portable_build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # More oracle shards barely help: its longest test (bootstrap refusal) takes about four minutes.
        include:
          - {backend: portable, shard: 1, shards: 2}
          - {backend: portable, shard: 2, shards: 2}
          - {backend: oracle, shard: 1, shards: 4}
          - {backend: oracle, shard: 2, shards: 4}
          - {backend: oracle, shard: 3, shards: 4}
          - {backend: oracle, shard: 4, shards: 4}
          - {backend: rayon, shard: 1, shards: 1}

    steps:
      # Some tests read sources and fixtures from the checkout.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download test binaries
        uses: actions/download-artifact@v4
        with:
          name: portable-tests-${{ matrix.backend }}
          path: ${{ runner.temp }}

      - name: Test shard
        run: |
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/tests.tar"
          bash .github/scripts/test-shard.sh run "$RUNNER_TEMP/tests" ${{ matrix.shard }} ${{ matrix.shards }}

  avx:
    name: AVX backend (native or SDE)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.crates), 'poulpy-cpu-avx')
    runs-on: ubuntu-24.04
    # Cold compilation is separate from the eight-minute test execution budget.
    timeout-minutes: 22

    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-feature=+avx2,+fma
      RUSTDOCFLAGS: -C target-feature=+avx2,+fma
      CARGO_PROFILE_CI_DEBUG: 0
      RAYON_NUM_THREADS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu
          components: clippy

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-avx-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-avx-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-avx-${{ env.RUST_TOOLCHAIN }}-

      - name: Clippy AVX backend
        run: cargo clippy --workspace --all-targets --features "$AVX_FEATURES" -- -D warnings

      - name: Detect native AVX2 and FMA support
        id: avx
        shell: bash
        run: |
          rustc --edition=2024 -o "$RUNNER_TEMP/check-avx" - <<'RS'
          fn main() {
              let native = std::is_x86_feature_detected!("avx2")
                  && std::is_x86_feature_detected!("fma");
              println!("mode={}", if native { "native" } else { "emulated" });
          }
          RS
          "$RUNNER_TEMP/check-avx" | tee -a "$GITHUB_OUTPUT"

      - name: Install Intel SDE
        if: steps.avx.outputs.mode == 'emulated'
        run: |
          curl --fail --location --retry 3 "$SDE_URL" --output "$RUNNER_TEMP/$SDE_ARCHIVE"
          printf '%s  %s\n' "$SDE_SHA256" "$RUNNER_TEMP/$SDE_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/intel-sde"
          tar --extract --xz --file "$RUNNER_TEMP/$SDE_ARCHIVE" --directory "$RUNNER_TEMP/intel-sde" --strip-components=1
          sudo sysctl -w kernel.yama.ptrace_scope=0
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER=$RUNNER_TEMP/intel-sde/sde64 -hsw --" >> "$GITHUB_ENV"

      - name: Compile AVX test binary
        run: bash .github/scripts/test-backend.sh build avx '${{ steps.avx.outputs.mode }}'

      - name: Test AVX backend
        timeout-minutes: 10
        run: bash .github/scripts/test-backend.sh test avx '${{ steps.avx.outputs.mode }}'

  intel_macos_avx:
    name: Intel macOS AVX smoke
    needs: changes
    if: >-
      contains(fromJSON(needs.changes.outputs.crates), 'poulpy-ckks') ||
      contains(fromJSON(needs.changes.outputs.crates), 'poulpy-cpu-portable') ||
      contains(fromJSON(needs.changes.outputs.crates), 'poulpy-cpu-avx')
    runs-on: macos-15-intel
    timeout-minutes: 15

    env:
      RUSTFLAGS: -C target-feature=+avx2,+fma
      SMOKE_FEATURES: >-
        poulpy-cpu-portable/enable-ckks
        poulpy-cpu-avx/enable-avx
        poulpy-cpu-avx/enable-ckks
        poulpy-ckks/libquadmath

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-15-intel-cargo-avx-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-15-intel-cargo-avx-

      - name: Test portable binary128 math on Darwin
        run: |
          CARGO_TERM_COLOR=never cargo test -p poulpy-ckks --lib --features libquadmath -- --list | grep -Ec '^scalar::tests::portable_(binary128_roundtrip|log_regressions_terminate|math_surface_values|special_value_semantics): test$' | grep -qx '4'
          cargo test -p poulpy-ckks --lib --features libquadmath scalar::tests::portable_binary128_roundtrip -- --exact
          cargo test -p poulpy-ckks --lib --features libquadmath scalar::tests::portable_log_regressions_terminate -- --exact
          cargo test -p poulpy-ckks --lib --features libquadmath scalar::tests::portable_math_surface_values -- --exact
          cargo test -p poulpy-ckks --lib --features libquadmath scalar::tests::portable_special_value_semantics -- --exact

      - name: Test Quad CKKS encoding on Darwin
        run: >-
          cargo test -p poulpy-cpu-portable -p poulpy-cpu-avx --lib
          --features "$SMOKE_FEATURES"
          ckks_encoding::tests::fft64_precision_families_coexist_in_one_module
          -- --exact

      - name: Test Darwin AVX FFT assembly
        run: >-
          cargo test -p poulpy-cpu-portable -p poulpy-cpu-avx --lib
          --features "$SMOKE_FEATURES"
          fft64::reim::fft_avx2_fma::tests::fft_ifft_roundtrip_avx2
          -- --exact

      - name: Test CKKS encoding determinism on Intel macOS
        run: >-
          cargo test -p poulpy-cpu-portable -p poulpy-cpu-avx --lib
          --features "$SMOKE_FEATURES"
          determinism

  macos_arm_quad:
    name: Apple Silicon Quad smoke
    needs: changes
    if: >-
      contains(fromJSON(needs.changes.outputs.crates), 'poulpy-ckks') ||
      contains(fromJSON(needs.changes.outputs.crates), 'poulpy-cpu-portable') ||
      contains(fromJSON(needs.changes.outputs.crates), 'poulpy-cpu-arm')
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm-cargo-quad-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-arm-cargo-quad-

      - name: Test portable binary128 and Quad encoding
        run: |
          CARGO_TERM_COLOR=never cargo test -p poulpy-ckks --lib --features libquadmath -- --list | grep -Ec '^scalar::tests::portable_(binary128_roundtrip|log_regressions_terminate|math_surface_values|special_value_semantics): test$' | grep -qx '4'
          cargo test -p poulpy-ckks --lib --features libquadmath scalar::tests::portable_binary128_roundtrip -- --exact
          cargo test -p poulpy-ckks --lib --features libquadmath scalar::tests::portable_log_regressions_terminate -- --exact
          cargo test -p poulpy-ckks --lib --features libquadmath scalar::tests::portable_math_surface_values -- --exact
          cargo test -p poulpy-ckks --lib --features libquadmath scalar::tests::portable_special_value_semantics -- --exact
          cargo test -p poulpy-cpu-portable --lib --features "enable-ckks,poulpy-ckks/libquadmath" ckks_encoding::tests::fft64_precision_families_coexist_in_one_module -- --exact

      - name: Test CKKS encoding determinism on Apple Silicon
        run: >-
          cargo test -p poulpy-cpu-portable -p poulpy-cpu-arm --lib
          --features "poulpy-cpu-portable/enable-ckks,poulpy-cpu-arm/enable-neon,poulpy-cpu-arm/enable-ckks"
          determinism

  avx512_lint:
    name: AVX-512 lint
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.crates), 'poulpy-cpu-avx512')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Same target-scoped flags as avx512_build.
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-feature=+avx2,+fma,+avx512f,+avx512ifma,+avx512vl,+bmi2,+adx
      RUSTDOCFLAGS: -C target-feature=+avx2,+fma,+avx512f,+avx512ifma,+avx512vl,+bmi2,+adx

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu
          components: clippy

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-avx512-lint-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-avx512-lint-${{ env.RUST_TOOLCHAIN }}-

      - name: Clippy AVX-512 backend
        run: cargo clippy --workspace --all-targets --features "$AVX512_FEATURES" -- -D warnings

  avx512_build:
    name: AVX-512 build
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.crates), 'poulpy-cpu-avx512')
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    # Hosted runners need not expose AVX-512, so we keep AVX-512 flags
    # off the host toolchain (build scripts, proc-macros). We pin --target and
    # use the target-scoped CARGO_TARGET_<TRIPLE>_RUSTFLAGS variable so host
    # artifacts stay portable while the workspace itself builds for AVX-512.
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-feature=+avx2,+fma,+avx512f,+avx512ifma,+avx512vl,+bmi2,+adx
      RUSTDOCFLAGS: -C target-feature=+avx2,+fma,+avx512f,+avx512ifma,+avx512vl,+bmi2,+adx
      CARGO_PROFILE_CI_DEBUG: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-avx512-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-avx512-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
            ${{ runner.os }}-${{ runner.arch }}-cargo-avx512-${{ env.RUST_TOOLCHAIN }}-

      - name: Compile AVX-512 test binary
        shell: bash
        run: |
          # The native feature set includes the emulated one, so one binary serves both modes.
          cargo test -p poulpy-cpu-avx512 --lib --profile ci --features enable-ifma,enable-rayon,enable-ckks,enable-bin-fhe,enable-blas \
            --no-run --message-format=json-render-diagnostics |
            bash .github/scripts/test-shard.sh pack "$RUNNER_TEMP/tests"
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/tests.tar" tests

      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: avx512-tests
          path: ${{ runner.temp }}/tests.tar
          retention-days: 1

  # Each shard runs natively when its runner exposes every required CPU feature, otherwise under SDE.
  avx512_test:
    name: AVX-512 tests (${{ matrix.group }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: avx512_build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # `blas` keeps the BLAS tests emulation can afford; native runners also cover them under `contracts`.
        # Four of its matmul tests take two to three minutes each under SDE; more shards barely help.
        include:
          - {group: contracts, shard: 1, shards: 4}
          - {group: contracts, shard: 2, shards: 4}
          - {group: contracts, shard: 3, shards: 4}
          - {group: contracts, shard: 4, shards: 4}
          - {group: blas, shard: 1, shards: 3}
          - {group: blas, shard: 2, shards: 3}
          - {group: blas, shard: 3, shards: 3}

    env:
      # Exercise the Rayon overrides with a bounded pool under emulation.
      RAYON_NUM_THREADS: 2
      RUST_TEST_THREADS: 2

    steps:
      # Some tests read sources and fixtures from the checkout.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Only for the CPU feature probe.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Detect native AVX-512 support
        id: avx512
        run: |
          # Compile for the baseline host, without the target-scoped Cargo flags.
          # Runtime detection also checks the OS enables AVX/AVX-512 register state.
          rustc --edition=2024 -o "$RUNNER_TEMP/check-avx512" - <<'RS'
          fn main() {
              // Include the features LLVM enables implicitly with our target flags.
              let native = std::is_x86_feature_detected!("avx2")
                  && std::is_x86_feature_detected!("fma")
                  && std::is_x86_feature_detected!("avx512f")
                  && std::is_x86_feature_detected!("avx512ifma")
                  && std::is_x86_feature_detected!("avx512vl")
                  && std::is_x86_feature_detected!("bmi2")
                  && std::is_x86_feature_detected!("adx")
                  && std::is_x86_feature_detected!("avx")
                  && std::is_x86_feature_detected!("f16c")
                  && std::is_x86_feature_detected!("sse3")
                  && std::is_x86_feature_detected!("ssse3")
                  && std::is_x86_feature_detected!("sse4.1")
                  && std::is_x86_feature_detected!("sse4.2");
              println!("mode={}", if native { "native" } else { "emulated" });
          }
          RS
          "$RUNNER_TEMP/check-avx512" | tee -a "$GITHUB_OUTPUT"

      - name: Install Intel SDE
        if: steps.avx512.outputs.mode == 'emulated'
        run: |
          curl --fail --location --retry 3 "$SDE_URL" --output "$RUNNER_TEMP/$SDE_ARCHIVE"
          printf '%s  %s\n' "$SDE_SHA256" "$RUNNER_TEMP/$SDE_ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/intel-sde"
          tar --extract --xz --file "$RUNNER_TEMP/$SDE_ARCHIVE" --directory "$RUNNER_TEMP/intel-sde" --strip-components=1
          # Pin/SDE may need to attach to its parent on Ubuntu; this hosted VM is ephemeral.
          sudo sysctl -w kernel.yama.ptrace_scope=0
          # Ice Lake includes AVX-512F, AVX-512VL and IFMA.
          echo "TEST_RUNNER=$RUNNER_TEMP/intel-sde/sde64 -icl --" >> "$GITHUB_ENV"

      - name: Download test binary
        uses: actions/download-artifact@v4
        with:
          name: avx512-tests
          path: ${{ runner.temp }}

      - name: Test shard
        timeout-minutes: 10
        shell: bash
        run: |
          mode='${{ steps.avx512.outputs.mode }}'
          group='${{ matrix.group }}'
          [[ "$group" == blas ]] || group=
          if [[ "$mode" == emulated ]]; then export POULPY_TEST_EMULATED=1; fi
          filters=$(bash .github/scripts/test-backend.sh filters avx512 "$mode" $group)
          mapfile -t filters <<< "$filters"
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/tests.tar"
          bash .github/scripts/test-shard.sh run "$RUNNER_TEMP/tests" ${{ matrix.shard }} ${{ matrix.shards }} "${filters[@]}"

  neon:
    name: NEON backend (aarch64 native)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.crates), 'poulpy-cpu-arm')
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: arm64-cargo-neon-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            arm64-cargo-neon-

      - name: Check NEON backend
        run: cargo check --workspace --all-targets --features "$NEON_FEATURES"

      - name: Clippy NEON backend
        run: cargo clippy --workspace --all-targets --features "$NEON_FEATURES" -- -D warnings

      - name: Test NEON backend
        shell: bash
        run: cargo test -p poulpy-cpu-arm --profile ci --features "$NEON_FEATURES"

  # Optional emulator validation; the required native neon job runs the full suite.
  neon_hal:
    name: NEON HAL, core and CKKS (manual QEMU)
    if: github.event_name == 'workflow_dispatch' && inputs.run_neon_qemu
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CARGO_BUILD_TARGET: aarch64-unknown-linux-gnu
      RAYON_NUM_THREADS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install AArch64 toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          # Cortex-A72 supplies baseline NEON; -L locates the target libc.
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER=qemu-aarch64 -cpu cortex-a72 -L /usr/aarch64-linux-gnu" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-neon-hal-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-neon-hal-

      - name: Test NEON HAL, core and CKKS operations
        shell: bash
        # Exercise optional HAL, core and CKKS contract coverage and include constant-convolution kernel tests.
        run: >-
          cargo test -p poulpy-cpu-arm --lib --profile ci
          --features "enable-neon,enable-rayon,enable-ckks" --
          test_vec_znx test_svp test_vmp test_convolution test_cnv test_word_compat test_transfer
          raw_transform_matches_contract convolution_by_const core_parity core_encryption glwe_copy ckks_parity
          --test-threads=2

  miri:
    name: Miri (poulpy-hal unit tests)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.crates), 'poulpy-hal')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: miri

      - name: Cache cargo deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-miri-${{ hashFiles('**/Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-miri-
            ${{ runner.os }}-cargo-

      - name: Miri setup
        run: cargo miri setup

      - name: Miri poulpy-hal unit tests
        run: cargo miri test -p poulpy-hal --lib

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    needs:
      - changes
      - portable_lint
      - portable_libs
      - portable_quad
      - portable_build
      - portable_test
      - avx
      - intel_macos_avx
      - macos_arm_quad
      - avx512_lint
      - avx512_build
      - avx512_test
      - neon
      - neon_hal
      - miri
    if: always()

    steps:
      - name: Check CI jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
          # Pull requests skip the jobs their changes cannot affect; other events run every job.
          ALLOWED: ${{ github.event_name == 'pull_request' && 'success skipped' || 'success' }}
          NEON_QEMU: ${{ github.event_name == 'workflow_dispatch' && inputs.run_neon_qemu }}
        run: |
          failed=$(jq -r --arg allowed "$ALLOWED" --arg qemu "$NEON_QEMU" '
            to_entries[]
            | (if .key == "changes" then "success"
               elif .key == "neon_hal" then (if $qemu == "true" then "success" else "skipped" end)
               else $allowed end | split(" ")) as $ok
            | select(.value.result as $result | $ok | index($result) == null)
            | "\(.key) finished with: \(.value.result)"' <<< "$RESULTS")
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
          echo "All required CI jobs passed, including NEON QEMU when requested."
