[package]
name = "poulpy-cpu-avx"
version = "0.8.3"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
description = "A crate providing concrete AVX accelerated CPU implementations of poulpy-hal through its open extension points"
repository = "https://github.com/poulpy-fhe/poulpy"
homepage = "https://github.com/poulpy-fhe/poulpy"
documentation = "https://docs.rs/poulpy-cpu-avx"

[lib]
doctest = false

[features]
enable-bin-fhe = ["dep:poulpy-bin-fhe", "poulpy-cpu-ref/enable-bin-fhe"]
enable-avx = []
enable-rayon = ["enable-avx", "dep:rayon", "dep:poulpy-cpu-rayon"]
enable-ckks = ["dep:poulpy-ckks", "poulpy-cpu-ref/enable-ckks"]

[dependencies]
poulpy-bin-fhe = {workspace = true, optional = true}
bytemuck = {workspace = true}
poulpy-ckks = {workspace = true, optional = true}
poulpy-core = {workspace = true}
poulpy-hal = {workspace = true}
poulpy-cpu-ref = {workspace = true}
poulpy-cpu-rayon = {workspace = true, optional = true}
itertools = {workspace = true}
rand = {workspace = true}
rand_distr = {workspace = true}
rand_core = {workspace = true}
byteorder = {workspace = true}
once_cell = {workspace = true}
rand_chacha = {workspace = true}
paste = {workspace = true}
rayon = {workspace = true, optional = true}

[dev-dependencies]
# Serial core parity suites select portable comparison backends.
poulpy-cpu-ref = {workspace = true, features = ["enable-core", "enable-test-suite"]}
poulpy-ckks = {workspace = true, features = ["test-utils"]}
poulpy-bin-fhe = {workspace = true}
poulpy-bench = {workspace = true}
criterion = {workspace = true}
anyhow = {workspace = true}

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "full"
harness = false
required-features = ["enable-avx", "enable-ckks", "enable-bin-fhe"]

[[bench]]
name = "standard"
harness = false
required-features = ["enable-avx", "enable-ckks", "enable-bin-fhe"]

[[bench]]
name = "light"
harness = false
required-features = ["enable-avx", "enable-ckks", "enable-bin-fhe"]

[[bench]]
name = "normalize"
harness = false
required-features = ["enable-avx"]
