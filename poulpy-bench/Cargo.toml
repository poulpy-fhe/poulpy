[package]
name = "poulpy-bench"
version = "0.8.2"
edition = "2024"
license = "Apache-2.0"
description = "Consolidated benchmark suite for poulpy"
repository = "https://github.com/poulpy-fhe/poulpy"
homepage = "https://github.com/poulpy-fhe/poulpy"
publish = false
readme = "README.md"


[dependencies]
criterion = {workspace = true}
rand = {workspace = true}
serde = {workspace = true, features = ["derive"]}
serde_json = {workspace = true}
poulpy-hal = {workspace = true}
poulpy-core = {workspace = true}
poulpy-bin-fhe = {workspace = true}
poulpy-ckks = {workspace = true, features = ["test-utils"]}
