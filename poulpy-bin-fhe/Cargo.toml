[package]
name = "poulpy-bin-fhe"
version = "0.8.2"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
description = "Binary/gate-level Module-LWE-based FHE built on Poulpy core and HAL"
repository = "https://github.com/poulpy-fhe/poulpy"
homepage = "https://github.com/poulpy-fhe/poulpy"
documentation = "https://docs.rs/poulpy-bin-fhe"

[features]
# Kept as the historical opt-in switch used by the CI feature sets and by
# downstream crates; the gate-level API itself is unconditional.
enable-bin-fhe = []

[dependencies]
poulpy-hal = {workspace = true}
poulpy-core = {workspace = true}
itertools = {workspace = true}
byteorder = {workspace = true}
rand = {workspace = true}
paste = {workspace = true}
anyhow = {workspace = true}
