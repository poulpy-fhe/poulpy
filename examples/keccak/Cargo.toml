[package]
name = "poulpy-keccak"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Keccak-f[1600] on eight encrypted states with poulpy-ckks and binary bootstrapping"
repository.workspace = true
homepage.workspace = true
publish = false

[features]
# The server's backend, at most one: a Rayon CPU backend or a GPU backend. The client stays on NTT4x30Portable.
portable-rayon = ["dep:poulpy-cpu-rayon"]
neon = ["dep:poulpy-cpu-arm", "poulpy-cpu-arm/enable-rayon"]
avx = ["dep:poulpy-cpu-avx", "poulpy-cpu-avx/enable-rayon"]
avx512 = ["dep:poulpy-cpu-avx512", "poulpy-cpu-avx512/enable-rayon"]
cuda = ["dep:poulpy-gpu-portable", "poulpy-gpu-portable/enable-cuda"]
hip = ["dep:poulpy-gpu-portable", "poulpy-gpu-portable/enable-hip"]
metal = ["dep:poulpy-gpu-portable", "poulpy-gpu-portable/enable-metal"]
vulkan = ["dep:poulpy-gpu-portable", "poulpy-gpu-portable/enable-vulkan"]

[dependencies]
poulpy-hal = {workspace = true}
poulpy-core = {workspace = true}
poulpy-ckks = {workspace = true}
anyhow = {workspace = true}
poulpy-cpu-portable = {workspace = true, features = ["enable-ckks"]}
poulpy-cpu-rayon = {workspace = true, optional = true, features = ["enable-ckks"]}
poulpy-cpu-arm = {workspace = true, optional = true, features = ["enable-ckks"]}
poulpy-cpu-avx = {workspace = true, optional = true, features = ["enable-ckks"]}
poulpy-cpu-avx512 = {workspace = true, optional = true, features = ["enable-ckks"]}
poulpy-gpu-portable = {workspace = true, optional = true, features = ["enable-ckks"]}

