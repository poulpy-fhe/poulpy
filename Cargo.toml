[workspace]
members = [
    "base/poulpy-hal",
    "base/poulpy-core",
    "schemes/poulpy-ckks",
    "schemes/poulpy-bin-fhe",
    "schemes/poulpy-mhe",
    "libs/poulpy-blas",
    "backends/poulpy-cpu-portable",
    "backends/poulpy-cpu-avx",
    "backends/poulpy-cpu-avx512",
    "backends/poulpy-cpu-arm",
    "backends/poulpy-cpu-rayon",
    "backends/poulpy-cpu-oracle",
    "tools/poulpy-bench",
]
default-members = [
    "base/poulpy-hal",
    "base/poulpy-core",
    "schemes/poulpy-ckks",
    "schemes/poulpy-bin-fhe",
    "schemes/poulpy-mhe",
    "libs/poulpy-blas",
    "backends/poulpy-cpu-portable",
    "backends/poulpy-cpu-avx",
    "backends/poulpy-cpu-arm",
    "tools/poulpy-bench",
]
resolver = "3"

[profile.ci]
inherits = "test"
opt-level = 2

# Optimized build that keeps debug symbols, for sampling profilers (samply, perf,
# cargo-flamegraph). Realistic timings + resolvable function names.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[workspace.dependencies]
poulpy-hal = {path = "base/poulpy-hal", version = "0.9.0"}
poulpy-core = {path = "base/poulpy-core", version = "0.9.0"}
poulpy-cpu-avx = {path = "backends/poulpy-cpu-avx", version = "0.9.0"}
poulpy-cpu-arm = {path = "backends/poulpy-cpu-arm", version = "0.9.0"}
poulpy-cpu-portable = {path = "backends/poulpy-cpu-portable", version = "0.9.0"}
poulpy-cpu-avx512 = {path = "backends/poulpy-cpu-avx512", version = "0.9.0"}
poulpy-cpu-rayon = {path = "backends/poulpy-cpu-rayon", version = "0.9.0"}
poulpy-bin-fhe = {path = "schemes/poulpy-bin-fhe", version = "0.9.0"}
poulpy-cpu-oracle = {path = "backends/poulpy-cpu-oracle"}
poulpy-bench = {path = "tools/poulpy-bench"}
poulpy-ckks = {path = "schemes/poulpy-ckks", version = "0.9.0"}
poulpy-mhe = {path = "schemes/poulpy-mhe", version = "0.9.0"}
poulpy-blas = {path = "libs/poulpy-blas", version = "0.9.0"}
dashu-float = "0.6.2"
dashu-int = "0.6.2"
# Reproducible setup requires the same resolved math dependencies on each target.
# Keep compatible ranges for downstream resolution and lock CI with Cargo.lock.
astro-float-num = { version = "0.3.7", default-features = false, features = ["std"] }
libm = { version = "0.2.16", default-features = false }
rand = "0.10.3"
rand_chacha = "0.10.0"
rand_core = "0.10.1"
rand_distr = "0.6.0"
num-traits = "0.2.19"
itertools = "0.15.0"
criterion = "0.8.2"
byteorder = "1.5.0"
once_cell = "1.21.4"
rayon = "1.12.0"
bytemuck = { version = "1.25.2", features = ["min_const_generics"] }
paste = "1.0.15"
serde = "1.0.229"
serde_json = "1.0.151"
anyhow = "1.0.104"
