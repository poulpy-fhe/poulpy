[workspace]
members = ["poulpy-cpu-oracle", "poulpy-hal", "poulpy-core", "poulpy-cpu-avx", "poulpy-cpu-avx512", "poulpy-cpu-arm", "poulpy-cpu-rayon", "poulpy-bin-fhe", "poulpy-cpu-portable", "poulpy-bench", "poulpy-ckks", "poulpy-mhe"]
default-members = ["poulpy-hal", "poulpy-core", "poulpy-cpu-avx", "poulpy-cpu-arm", "poulpy-bin-fhe", "poulpy-cpu-portable", "poulpy-bench", "poulpy-ckks", "poulpy-mhe"]
resolver = "3"

[profile.ci]
inherits = "test"
opt-level = 2

# Optimized build that keeps debug symbols, for sampling profilers (samply, perf,
# cargo-flamegraph). Realistic timings + resolvable function names.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[workspace.dependencies]
poulpy-hal = {path = "poulpy-hal", version = "0.9.0"}
poulpy-core = {path = "poulpy-core", version = "0.9.0"}
poulpy-cpu-avx = {path = "poulpy-cpu-avx", version = "0.9.0"}
poulpy-cpu-arm = {path = "poulpy-cpu-arm", version = "0.9.0"}
poulpy-cpu-portable = {path = "poulpy-cpu-portable", version = "0.9.0"}
poulpy-cpu-avx512 = {path = "poulpy-cpu-avx512", version = "0.9.0"}
poulpy-cpu-rayon = {path = "poulpy-cpu-rayon", version = "0.9.0"}
poulpy-bin-fhe = {path = "poulpy-bin-fhe", version = "0.9.0"}
poulpy-cpu-oracle = {path = "poulpy-cpu-oracle"}
poulpy-bench = {path = "poulpy-bench"}
poulpy-ckks = {path = "poulpy-ckks", version = "0.9.0"}
poulpy-mhe = {path = "poulpy-mhe", version = "0.9.0"}
dashu-float = "0.6.2"
dashu-int = "0.6.2"
# Reproducible setup requires the same resolved math dependencies on each target.
# Keep compatible ranges for downstream resolution and lock CI with Cargo.lock.
astro-float-num = { version = "0.3.7", default-features = false, features = ["std"] }
libm = { version = "0.2.16", default-features = false }
rand = "0.10.3"
rand_chacha = "0.10.0"
rand_core = "0.10.1"
rand_distr = "0.6.0"
num-traits = "0.2.19"
itertools = "0.15.0"
criterion = "0.8.2"
byteorder = "1.5.0"
once_cell = "1.21.4"
rayon = "1.12.0"
bytemuck = { version = "1.25.2", features = ["min_const_generics"] }
paste = "1.0.15"
serde = "1.0.229"
serde_json = "1.0.151"
anyhow = "1.0.104"
