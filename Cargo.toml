[workspace]
members = ["poulpy-hal", "poulpy-core", "poulpy-cpu-avx", "poulpy-cpu-avx512", "poulpy-cpu-arm", "poulpy-bin-fhe", "poulpy-cpu-ref", "poulpy-bench", "poulpy-ckks"]
default-members = ["poulpy-hal", "poulpy-core", "poulpy-cpu-avx", "poulpy-cpu-arm", "poulpy-bin-fhe", "poulpy-cpu-ref", "poulpy-bench", "poulpy-ckks"]
resolver = "3"

# Optimized build that keeps debug symbols, for sampling profilers (samply, perf,
# cargo-flamegraph). Realistic timings + resolvable function names.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[workspace.dependencies]
poulpy-hal = {path = "poulpy-hal"}
poulpy-core = {path = "poulpy-core"}
poulpy-cpu-avx = {path = "poulpy-cpu-avx"}
poulpy-cpu-arm = {path = "poulpy-cpu-arm"}
poulpy-cpu-ref = {path = "poulpy-cpu-ref"}
poulpy-cpu-avx512 = {path = "poulpy-cpu-avx512"}
poulpy-bin-fhe = {path = "poulpy-bin-fhe"}
poulpy-ckks = {path = "poulpy-ckks"}
dashu-float = "0.4.5"
rand = "0.10.2"
rand_chacha = "0.10.0"
rand_core = "0.10.1"
rand_distr = "0.6.0"
num-traits = "0.2"
itertools = "0.15.0"
criterion = "0.8.2"
byteorder = "1.5.0"
zstd = "0.13.3"
once_cell = "1.21.4"
bytemuck = "1.25.0"
paste = "1.0.15"
serde = "1"
serde_json = "1.0.150"
anyhow = "1.0.103"
