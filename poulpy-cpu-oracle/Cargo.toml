[package]
name = "poulpy-cpu-oracle"
version = "0.9.0"
edition = "2024"
publish = false
license = "Apache-2.0"
readme = "README.md"
description = "Independent scalar CPU oracle for Poulpy correctness tests"
repository = "https://github.com/poulpy-fhe/poulpy"
homepage = "https://github.com/poulpy-fhe/poulpy"

[features]
enable-core = ["dep:poulpy-core"]
enable-ckks = ["enable-core", "dep:poulpy-ckks", "dep:anyhow"]
enable-bin-fhe = ["enable-core", "dep:poulpy-bin-fhe"]

[dependencies]
anyhow = {workspace = true, optional = true}
dashu-int = {workspace = true}
poulpy-core = {workspace = true, optional = true}
poulpy-ckks = {workspace = true, optional = true}
poulpy-bin-fhe = {workspace = true, optional = true}
poulpy-hal = {workspace = true}
bytemuck = {workspace = true}
rand = {workspace = true}
rand_distr = {workspace = true}

[lib]
doctest = false

[dev-dependencies]
once_cell = {workspace = true}
poulpy-ckks = {workspace = true, features = ["test-utils"]}
