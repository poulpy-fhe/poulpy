[package]
name = "poulpy-cpu-oracle"
version = "0.8.3"
edition = "2024"
publish = false
license = "Apache-2.0"
readme = "README.md"
description = "Independent scalar CPU oracle for Poulpy correctness tests"
repository = "https://github.com/poulpy-fhe/poulpy"
homepage = "https://github.com/poulpy-fhe/poulpy"

[features]
enable-core = []
enable-ckks = ["dep:poulpy-ckks", "enable-core"]

[dependencies]
anyhow = {workspace = true}
poulpy-ckks = {workspace = true, optional = true}
poulpy-core = {workspace = true}
poulpy-hal = {workspace = true}
dashu-float = {workspace = true}
bytemuck = {workspace = true}
itertools = {workspace = true}
rand = {workspace = true}
rand_distr = {workspace = true}
rand_core = {workspace = true}
byteorder = {workspace = true}
once_cell = {workspace = true}
rand_chacha = {workspace = true}

[lib]
doctest = false

[dev-dependencies]
dashu-int = {workspace = true}
poulpy-ckks = {workspace = true, features = ["test-utils"]}
poulpy-bin-fhe = {workspace = true}
