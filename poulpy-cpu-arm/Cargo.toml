[package]
name = "poulpy-cpu-arm"
version = "0.8.2"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
description = "A crate providing concrete NEON accelerated CPU implementations of poulpy-hal through its open extension points"
repository = "https://github.com/poulpy-fhe/poulpy"
homepage = "https://github.com/poulpy-fhe/poulpy"
documentation = "https://docs.rs/poulpy-cpu-arm"

[lib]
doctest = false

[features]
enable-neon = []
enable-ckks = ["dep:poulpy-ckks", "poulpy-cpu-ref/enable-ckks"]

[dependencies]
bytemuck = {workspace = true}
poulpy-ckks = {workspace = true, optional = true}
poulpy-core = {workspace = true}
poulpy-hal = {workspace = true}
poulpy-cpu-ref = {workspace = true}
itertools = {workspace = true}
rand = {workspace = true}
rand_distr = {workspace = true}
rand_core = {workspace = true}
byteorder = {workspace = true}
once_cell = {workspace = true}
rand_chacha = {workspace = true}
paste = {workspace = true}

[dev-dependencies]
# The core parity suites compare against the reference backend's impls.
poulpy-cpu-ref = {workspace = true, features = ["enable-core"]}
poulpy-ckks = {workspace = true, features = ["test-utils"]}
poulpy-bin-fhe = {workspace = true}
poulpy-bench = {workspace = true}
criterion = {workspace = true}
anyhow = {workspace = true}

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-unknown-linux-gnu"
targets = ["aarch64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "full"
harness = false
required-features = ["enable-neon", "enable-ckks"]

[[bench]]
name = "standard"
harness = false
required-features = ["enable-neon", "enable-ckks"]

[[bench]]
name = "light"
harness = false
required-features = ["enable-neon", "enable-ckks"]
