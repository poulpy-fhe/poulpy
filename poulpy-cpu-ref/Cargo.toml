[package]
name = "poulpy-cpu-ref"
version = "0.8.3"
edition = "2024"
license = "Apache-2.0"
readme = "README.md"
description = "Portable reference CPU implementations of poulpy-hal open extension points"
repository = "https://github.com/poulpy-fhe/poulpy"
homepage = "https://github.com/poulpy-fhe/poulpy"
documentation = "https://docs.rs/poulpy-cpu-ref"

[features]
enable-bin-fhe = ["dep:poulpy-bin-fhe", "enable-core"]
enable-core = []
enable-ckks = ["dep:poulpy-ckks", "enable-core"]
enable-mhe = ["dep:poulpy-mhe", "enable-core"]
# Ships the portable comparison adapters other backend crates test against.
# They panic outside a controlled-sampling scope, so keep this out of a build
# that is not running tests: enable it from `[dev-dependencies]` only.
enable-test-suite = ["enable-core"]

[dependencies]
poulpy-bin-fhe = {workspace = true, optional = true}
anyhow = {workspace = true}
poulpy-ckks = {workspace = true, optional = true}
poulpy-mhe = {workspace = true, optional = true}
poulpy-core = {workspace = true}
poulpy-hal = {workspace = true}
#poulpy-bench = {workspace = true}
dashu-float = {workspace = true}
bytemuck = {workspace = true}
itertools = {workspace = true}
rand = {workspace = true}
rand_distr = {workspace = true}
rand_core = {workspace = true}
byteorder = {workspace = true}
once_cell = {workspace = true}
rand_chacha = {workspace = true}

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "bootstrap_trace"
required-features = ["enable-ckks"]

[[example]]
name = "ckks_poly2"
required-features = ["enable-ckks"]

[[example]]
name = "ckks_hello"
required-features = ["enable-ckks"]

[[example]]
name = "core_encryption"
required-features = ["enable-core"]

[[example]]
name = "bdd_arithmetic"
required-features = ["enable-bin-fhe"]

[[example]]
name = "circuit_bootstrapping"
required-features = ["enable-bin-fhe"]

[[example]]
name = "max_array"
required-features = ["enable-bin-fhe"]

[dev-dependencies]
paste = {workspace = true}
dashu-int = {workspace = true}
poulpy-ckks = {workspace = true, features = ["test-utils"]}
poulpy-bin-fhe = {workspace = true}
criterion = {workspace = true}
# TODO: poulpy-bench's lib is currently #![cfg]-gated on its bench features
poulpy-bench = {workspace = true} #  features = ["hal-bench", "bin-fhe-bench", "ckks-bench", "core-bench"]

[[bench]]
name = "full"
harness = false
required-features = ["enable-core", "enable-ckks", "enable-bin-fhe"]

[[bench]]
name = "standard"
harness = false
required-features = ["enable-core", "enable-ckks", "enable-bin-fhe"]

[[bench]]
name = "light"
harness = false
required-features = ["enable-core", "enable-ckks", "enable-bin-fhe"]

[[bench]]
name = "normalize"
harness = false
